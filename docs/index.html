<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="모닝 브리핑" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f172a" />
  <title>모닝 브리핑</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 20px 16px 48px;
      max-width: 600px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 8px;
      font-weight: 600;
    }
    h1 { font-size: 22px; font-weight: 700; }
    .updated { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
    }
    .card h2 {
      font-size: 15px;
      color: var(--accent);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .weather-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 14px;
    }
    .temp-now { font-size: 28px; font-weight: 700; white-space: nowrap; }
    .summary-text {
      white-space: pre-wrap;
      font-size: 15px;
      color: #e2e8f0;
    }
    .tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      -webkit-overflow-scrolling: touch;
    }
    .tab-btn {
      flex: 1 0 auto;
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
    }
    ul.list { list-style: none; }
    ul.list li {
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 14px;
    }
    ul.list li:last-child { border-bottom: none; }
    a.news-link {
      display: block;
      color: var(--text);
      text-decoration: none;
    }
    a.news-link:hover, a.news-link:active { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <span class="badge">AI MORNING BRIEFING</span>
    <h1 id="date-title">모닝 브리핑 불러오는 중...</h1>
    <div class="updated" id="updated-at"></div>
  </header>

  <section class="card" id="weather-card">
    <h2>🌤️ 오늘 날씨</h2>
    <div class="weather-row" id="weather-content">날씨 정보를 불러오는 중입니다.</div>
  </section>

  <section class="card">
    <h2>✨ 아침 브리핑</h2>
    <div class="summary-text" id="summary-content">아직 생성된 브리핑이 없습니다. GitHub Actions에서 첫 실행(Run workflow)을 진행해 주세요!</div>
  </section>

  <section class="card">
    <h2>📰 주요 뉴스 헤드라인</h2>
    <div class="tabs" id="news-tabs"></div>
    <ul class="list" id="news-list">
      <li>뉴스 정보를 불러오는 중입니다.</li>
    </ul>
  </section>

  <script>
    const DEFAULT_CATEGORIES = ['글로벌주식', '경제', '연예', '스포츠', '정치'];
    let newsByCategory = {};
    let activeCategory = DEFAULT_CATEGORIES[0];

    function renderNews(category) {
      activeCategory = category;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.category === category);
      });

      const newsList = document.getElementById('news-list');
      const items = newsByCategory[category] || [];
      if (items.length > 0) {
        newsList.innerHTML = items.map(n =>
          `<li><a class="news-link" href="${n.link}" target="_blank" rel="noopener noreferrer">${n.title}</a></li>`
        ).join('');
      } else {
        newsList.innerHTML = '<li>해당 분야 뉴스를 불러오지 못했습니다.</li>';
      }
    }

    async function loadBriefing() {
      try {
        const res = await fetch('./data.json?t=' + Date.now());
        if (!res.ok) throw new Error('data.json 로드 실패');
        const data = await res.json();
        if (!data || Object.keys(data).length === 0) return;

        document.getElementById('date-title').textContent = data.date_label || '오늘의 모닝 브리핑';
        document.getElementById('updated-at').textContent = data.updated_at ? `업데이트: ${data.updated_at}` : '';

        if (data.weather && data.weather.temp_now !== null && data.weather.temp_now !== undefined) {
          const w = data.weather;
          document.getElementById('weather-content').innerHTML = `
            <div class="temp-now">${w.temp_now}°C</div>
            <div>최저 ${w.temp_min}°C / 최고 ${w.temp_max}°C · 강수확률 ${w.rain_prob}%</div>
          `;
        }

        if (data.summary) {
          document.getElementById('summary-content').textContent = data.summary;
        }

        const categories = Array.isArray(data.news_categories) && data.news_categories.length > 0
          ? data.news_categories
          : DEFAULT_CATEGORIES;

        newsByCategory = data.news_by_category || {};
        const tabsEl = document.getElementById('news-tabs');
        tabsEl.innerHTML = categories.map(cat =>
          `<button class="tab-btn" data-category="${cat}">${cat}</button>`
        ).join('');

        tabsEl.querySelectorAll('.tab-btn').forEach(btn => {
          btn.addEventListener('click', () => renderNews(btn.dataset.category));
        });

        renderNews(categories[0]);
      } catch (err) {
        console.warn(err);
      }
    }
    loadBriefing();
  </script>
</body>
</html>
